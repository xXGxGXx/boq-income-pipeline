name: Automation Forge Android
on:
  pull_request:
  push:
    branches: [integration/pr3-clean-main-2026-11-24]

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Run unit tests
        working-directory: automation-forge
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        working-directory: automation-forge
        run: ./gradlew assembleDebug

      - name: Upload test results and debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: |
            automation-forge/app/build/reports/tests/
            automation-forge/app/build/outputs/apk/debug/
          if-no-files-found: warn
