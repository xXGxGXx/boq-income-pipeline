# Runs on every pull request and every push to main, whichever assistant or person made it (once per commit:
# a branch push that also has a pull request would otherwise run everything twice).
# A red cross on a commit means one of these found a real problem; the job log says which file and why.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Integrity and privacy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      media_hub: ${{ steps.diff.outputs.media_hub }}
      forge: ${{ steps.diff.outputs.forge }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          fetch-depth: 0   # full history, so the secret scan sees every commit, not just the latest
      # The browser and Android jobs take most of the minutes, so they run only when their code (or the workflow)
      # changed, and only after this job passes. A private repository on GitHub Free gets 2,000 Actions minutes a
      # month, billed per job and rounded up to whole minutes. Actions > checks > Run workflow forces every job.
      - name: Which slow jobs this commit needs
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: bash .github/workflows/changed-areas.sh
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        with:
          node-version: "22"
      - name: Libraries the release builder needs (Media Hub icons, NDIS Word and Excel files)
        run: python3 -m pip install --quiet pillow python-docx openpyxl
      - name: Broken files (unexpanded $(cat ...), truncated key docs, conflict markers, hidden characters, syntax)
        run: python3 scripts/check_repo.py
      - name: Privacy scan (fails only on findings not already reviewed in .privacy-baseline)
        run: python3 scripts/privacy_scan.py --tracked --baseline .privacy-baseline
      - name: Secret scan of every commit (Gitleaks 8.28.0, checksum-pinned, rules in .gitleaks.toml)
        run: |
          curl -sSfL --retry 4 --retry-delay 5 -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --no-banner --redact --exit-code 1
      - name: Tests for the checker, the scanner and the release builder
        run: |
          python3 scripts/test_check_repo.py
          python3 scripts/test_privacy_scan.py
          python3 .claude/skills/media-hub-master/scripts/test_scripts.py
          python3 products/test_build_releases.py

  python:
    name: Orchestrators and Media Hub (unit and server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: "3.12"
      - name: Install ffmpeg, Pillow and test libraries
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet httpx requests pytest pillow
      - name: orchestrator/
        run: python3 -m unittest orchestrator/test_orchestrator.py
      - name: artifacts/ orchestrator
        run: python3 artifacts/test_orchestrator.py
      - name: Module F voice-to-chat injection (standard library only; no phone or adb needed)
        run: python3 skills/device-orchestration-stack/module_f/test_module_f.py
      - name: Media Hub unit and server tests (synthetic demo media only)
        working-directory: media-hub
        run: |
          python3 tools/make_demo.py build/demo
          python3 tools/build.py --catalog build/demo/catalog.json --plan build/demo/media_plan.json --out dist
          python3 -m unittest tests/test_range.py tests/test_optimize.py tests/test_library.py tests/test_checksums.py
          python3 -m pytest -q -p no:cacheprovider tests/test_media_serve.py

  browser:
    name: Media Hub in a real browser
    needs: integrity
    if: needs.integrity.outputs.media_hub == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        with:
          node-version: "22"
      - name: Install ffmpeg, Pillow, pytest and Playwright (Node and Python, each with its own Chromium)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet pytest playwright pillow
          python3 -m playwright install --with-deps chromium
          npm install --no-save --no-audit --no-fund --prefix media-hub playwright
          npx --prefix media-hub playwright install chromium
      - name: Every Media Hub suite (unit, server, 46 browser tests, 40-point checklist)
        run: bash media-hub/tests/run_all.sh

  forge:
    name: Automation Forge (Android build and unit tests)
    needs: integrity
    if: needs.integrity.outputs.forge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961   # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c   # v5.0.2; also checks the Gradle wrapper's checksums
      - name: Unit tests and a debug build
        working-directory: automation-forge
        # Maven Central sometimes answers "429 Too Many Requests"; wait and retry instead of failing the build.
        run: ./gradlew --no-daemon -Dorg.gradle.internal.repository.max.retries=8 -Dorg.gradle.internal.repository.initial.backoff=2000 testDebugUnitTest assembleDebug
      - name: Keep the debug APK and test reports (download them from this run's Artifacts section)
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4   # v5.0.0
        with:
          name: automation-forge-debug
          path: |
            automation-forge/app/build/outputs/apk/debug/*.apk
            automation-forge/app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
