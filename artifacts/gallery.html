<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Expulsion Gallery</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #eee; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  header { padding: 16px; background: #111; position: sticky; top: 0; z-index: 10; }
  h1 { font-size: 18px; margin-bottom: 8px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filters button { background: #222; color: #ccc; border: 1px solid #333; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; }
  .filters button.active { background: #4a9eff; color: #fff; border-color: #4a9eff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; padding: 12px; }
  .card { background: #161616; border-radius: 10px; overflow: hidden; cursor: pointer; }
  .card img { width: 100%; height: 220px; object-fit: cover; display: block; background: #1a1a1a; }
  .card .cap { padding: 8px; font-size: 11px; color: #999; line-height: 1.4; }
  .fs { display: none; position: fixed; inset: 0; background: #000; z-index: 100; }
  .fs.active { display: flex; align-items: center; justify-content: center; }
  .fs img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .fs .close { position: absolute; top: 16px; right: 16px; color: #fff; font-size: 28px; background: none; border: none; cursor: pointer; }
  .status { padding: 8px 16px; font-size: 12px; color: #666; }
</style>
</head>
<body>
<header>
  <h1 id="title">Expulsion Gallery</h1>
  <div class="filters" id="filters"></div>
  <div class="status" id="status">Loading...</div>
</header>
<div class="grid" id="grid"></div>
<div class="fs" id="fs"><button class="close" onclick="closeFs()">&times;</button><img id="fsImg"></div>
<script>
const MANIFEST = 'https://cdn.jsdelivr.net/gh/xXGxGXx/boq-income-pipeline@main/artifacts/gallery-manifest.json';
let data = null;
async function load() {
  try {
    const r = await fetch(MANIFEST + '?t=' + Date.now());
    data = await r.json();
    document.getElementById('title').textContent = data.title || 'Gallery';
    buildFilters(['all'].concat(data.categories));
    render('all);
    document.getElementById('status').textContent = 'Updated ' + (data.updated || '');
  } catch (e) {
    document.getElementById('status').textContent = 'Failed to load manifest: ' + e.message;
  }
}
function buildFilters(cats) {
  const el = document.getElementById('filters);
  el.innerHTML = '';
  cats.forEach(function(c) {
    const b = document.createElement('button);
    b.textContent = c;
    b.onclick = function() {
      document.querySelectorAll('.filters button').forEach(function(x) { x.classList.remove('active'); });
      b.classList.add('active);
      render(c);
    };
    el.appendChild(b);
  });
  if (el.firstChild) el.firstChild.classList.add('active);
}
function render(cat) {
  const grid = document.getElementById('grid);
  grid.innerHTML = '';
  (data.images || []).filter(function(i) { return cat === 'all' || i.category === cat; }).forEach(function(i) {
    const card = document.createElement('div);
    card.className = 'card';
    const img = document.createElement('img);
    img.src = i.url;
    img.loading = 'lazy';
    img.onerror = function() { this.style.background = '#300'; };
    const cap = document.createElement('div);
    cap.className = 'cap';
    cap.textContent = i.caption || '';
    card.appendChild(img);
    card.appendChild(cap);
    card.onclick = function() { openFs(i.url); };
    grid.appendChild(card);
  });
}
function openFs(url) {
  document.getElementById('fsImg').src = url;
  document.getElementById('fs').classList.add('active);
}
function closeFs() {
  document.getElementById('fs').classList.remove('active);
}
document.getElementById('fs').addEventListener('click', function(e) {
  if (e.target === e.currentTarget) closeFs();
});
load();
</script>
</body>
</html>
