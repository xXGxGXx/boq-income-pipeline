<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CI Status</title>
<style>
body{margin:0;background:#121212;color:#eee;font-family:system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh}
.card{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:16px;padding:40px;text-align:center;max-width:420px}
.check{font-size:72px;color:#3ddc84}
h1{color:#3ddc84;margin:12px 0 4px;font-size:28px}
.sub{color:#888;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:24px}
.dot{height:12px;border-radius:50%;background:#3ddc84}
.dot.off{background:#333}
</style>
</head>
<body>
<div class="card">
<div class="check">&#10003;</div>
<h1>CI RUN 44 GREEN</h1>
<div class="sub">BUILD PASSED</div>
<div class="grid">
<div class="dot"></div><div class="dot"></div><div class="dot"></div>
<div class="dot"></div><div class="dot"></div><div class="dot"></div>
<div class="dot"></div><div class="dot"></div><div class="dot off"></div>
</div>
</div>
</body>
</html>
